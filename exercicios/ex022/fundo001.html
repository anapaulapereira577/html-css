<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagem de Fundo</title>
    <style>
        div.quadrado {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            background-color: rgb(200, 228, 240);
            width: 300px;
            height: 300px;
        }

        div#q1 {
            background-color: rgb(190, 140, 169);

        }

        div#q2 {
            background-image: linear-gradient(to bottom,rgb(243, 146, 206),rgb(100, 187, 245));

        }

        div#q3 {
            background-image: url('imagens/pattern001.png');

        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">

    </div>
    
</body>
</html>

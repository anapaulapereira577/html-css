<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videos com HTML5</title>
</head>

<body>

<h1>Inserindo vídeos hospedados localmente</h1>
<p>Este vídeo está hospedado no meu próprio servidor.</p>

<video width="200" controls>
    <source src="midia/meu-video (1).mp4" type="video/mp4">
    <source src="midia/meu-video (2).webm" type="video/webm">
    <p>Seu navegador não tem compatibilidade com reprodução de vídeo.</p>
</video>

<h1>Inserindo vídeos do YouTube</h1>

<iframe width="560" height="315"
src="https://www.youtube.com/embed/YY8bq_Vau1U"
title="YouTube video player"
frameborder="0"
allowfullscreen>
</iframe>

<h1>Inserindo vídeos do Vimeo</h1>

<iframe
src="https://player.vimeo.com/video/367814939"
width="400"
height="225"
frameborder="0"
allow="autoplay; fullscreen; picture-in-picture"
allowfullscreen>
</iframe>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: rgb(236, 87, 157);
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color:rgb(224, 95, 121)
        }
        a:hover {
            color: black;
            text-decoration: underline;
        }
        :active {
            color: violet;
        }
        a::after {
            content:'[link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }

    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabra.github.io" >Repositório do Github</a></li>
        <li><a href="https://www.youtube.com/cursoemvideo/" target="_blank">Canal no Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com">Site do Curso em Vídeo</a></li>
    </ul>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática de formulários</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Cadastro</legend>
        <h1>Formulário de Cadastro</h1>
        <p>nome: <input type="text" name="nome" id="inome" required></p>
        <p>Sobrenome: <input type="text" name="sobrenome" id="isobrenome" required></p>
        <p>Email: <input type="email" name="email" id="iemail" required></p>
        <label for="isenha">Senha</label>
        <input type="password" name="senha" id="isenha" required>
        <label for="iconfirmar">Confirmar Senha</label>
        <input type="password" name="confirmarsenha" id="iconfirmar" required>
         <p><input type="submit" value="Enviar"></p>
         <p><input type="reset" value="Limpar"></p>
    </fieldset>
    </form>
    
</body>
</html>

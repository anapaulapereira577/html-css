<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prática de formulários</title>
</head>
<body>
    <fieldset>
    <legend>Login</legend>
    <h1>Formulários</h1>
    <form>
        <p>Nome: <input type="text" name="nome" id="inome" required></p>
        <p>Email: <input type="email" name="email" id="iemail" required></p>
        <p>Senha: <input type="password" name="senha" id="iesenha" required></p>
        <p><input type="submit" value="Enviar"></p>
        <p><input type="reset" value="Limpar"></p>
        </fieldset>

    </form>

    
</body>
</html>

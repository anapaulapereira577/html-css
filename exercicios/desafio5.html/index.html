<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas redes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        img.avatar {
            width: 150px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .social-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #000;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .social-links img {
            width: 30px;
            height: 30px;
        }
    </style>
</head>
<body>
    <h1>Quem sou eu?</h1>
    <img src="ana.png" alt="avatar da Ana" class="avatar">
    <p>Meu nome é Ana e sou estudante de desenvolvimento web.</p>

    <h2>Minhas redes sociais</h2>
    <div class="social-links">
        <a href="https://github.com/anapaulapereira577" target="_blank">
            <img src="icone-github.png" alt="GitHub"> GitHub
        </a>

        <a href="https://www.instagram.com/ana_dev/" target="_blank">
            <img src="icone-instagram.png" alt="Instagram"> Instagram
        </a>
    </div>
</body>
</html>

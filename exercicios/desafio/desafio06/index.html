<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tags em HTML</title>

<style>
abbr:hover{
    background-color: rgb(209, 159, 201);
    color: white;
    padding: 3px;
    border-radius: 4px;
    cursor: pointer;
}
</style>

</head>

<body>

<h1>Tags em HTML</h1>
<p>Passe o mouse sobre os termos para descobrir qual tag utilizar em cada caso.</p>

<ul>
<li><abbr title="Use a tag <p>">parágrafos</abbr></li>
<li><abbr title="Use a tag <h1> até <h6>">títulos</abbr></li>
<li><abbr title="Use a tag <a>">links</abbr></li>
<li><abbr title="Use a tag <img>">imagens</abbr></li>
<li><abbr title="Use a tag <abbr>">abreviações</abbr></li>
<li><abbr title="Use a tag <code>">código</abbr></li>
<li><abbr title="Use a tag <ol>">listas ordenadas</abbr></li>
<li><abbr title="Use a tag <ul>">listas não ordenadas</abbr></li>
</ul>

</body>
</html>

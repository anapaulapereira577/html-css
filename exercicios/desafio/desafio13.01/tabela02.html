<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif; 
         }
         table {
            border-collapse: collapse;
            width: 300px;
         }
         td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
         }
    </style>
</head>
<body>
    <h1>Tabelas</h1>
    <table>
        <tr>
             <td colspan="2">A</td>
             <td rowspan="6">B</td>
        </tr>
        <tr>
              <td rowspan="6">C</td>
              <td>D</td>
        </tr>
        <tr>
              <td>E</td>
              <td>F</td>
        </tr>
        <tr>
             <td>G</td>
             <td>H</td>
        </tr>
        <tr>
             <td>I</td>
              <td>K</td>
        </tr>
        <tr>
             <td>L</td>
              <td>M</td>
        </tr>
        <tr>
            <td colspan="3">N</td>
        </tr>
    </table>
    
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centalizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(172, 142, 153);
        }

        main {
            background-color: rgb(113, 183, 185);
            height: 100vh;
            width: 100vw;

             display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;

        }

        section {
            background-color: rgb(137, 224, 137);
            height: 200px;
            width: 200px;

            

        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela  de login</h1>
        </section>
    </main>
    
</body>
</html>
